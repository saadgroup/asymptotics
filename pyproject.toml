[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asymptotics"
version = "0.3.1"
description = "A symbolic perturbation theory toolkit built on SymPy"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tony Saad", email = "tony.saad@utah.edu" }]
requires-python = ">=3.10"
keywords = ["perturbation theory","asymptotic expansions","sympy","ODE","Lindstedt","multiple scales","boundary layers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["sympy>=1.12","numpy>=1.24","scipy>=1.10","matplotlib>=3.7"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.urls]
Homepage   = "https://github.com/saadgroup/asymptotics"
Repository = "https://github.com/saadgroup/asymptotics"
Issues     = "https://github.com/saadgroup/asymptotics/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["asymptotics*"]
exclude = ["asymptotics.tests*"]

# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    # Install the package itself (pulls sympy/numpy/scipy/matplotlib from
    # pyproject) so autodoc can import it.
    - method: pip
      path: .
    # Sphinx + theme + Markdown support.
    - requirements: docs/requirements.txt

formats:
  - htmlzip
